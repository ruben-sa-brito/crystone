default: &default
  adapter: postgresql
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: crystone_development
  username: <%= ENV["DATABASE_USERNAME"] %>

test:
  <<: *default
  database: crystone_test
  username: <%= ENV["DATABASE_USERNAME"] %>

production:
  primary:
    <<: *default
    database: crystone_production
    username: <%= ENV["DATABASE_USERNAME"] %>